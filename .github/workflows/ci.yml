
name: Calculator CI

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker test image
        run: docker build --target test -t python-calculator:test .

      - name: Run unit tests inside Docker
        run: docker run --rm python-calculator:test

      - name: Build production Docker image
        run: docker build --target runtime -t python-calculator:latest .
